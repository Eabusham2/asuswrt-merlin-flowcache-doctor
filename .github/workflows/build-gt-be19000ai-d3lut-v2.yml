name: Build GT-BE19000AI D3LUT repair v2

'on':
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-gt-be19000ai-d3lut-v2.yml

permissions:
  contents: read

env:
  MERLIN_COMMIT: e6ec7e95706d321c50d1b4b2f912b26323f6163e
  EXPECTED_VERSION: 3006.102.8_4
  EXPECTED_TARGET_DIR: /project/merlin/release/src-rt-5.04behnd.4916/targets/96813GW
  EXPECTED_FIRMWARE: GT-BE19000AI_3006_102.8_4_emmc_squashfs.pkgtb
  FCD_D3LUT_MARKER: FCD_DHD_D3LUT_REPAIR_V1

jobs:
  build:
    name: GT-BE19000AI 3006.102.8_4 D3LUT repair
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: gnuton/asuswrt-merlin-toolchains-docker:latest
      options: --user root
      volumes:
        - /mnt:/project

    steps:
      - name: Prepare exact Merlin 3006.102.8_4 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /project/merlin /project/artifacts /project/build-gt-be19000ai.sh
          mkdir -p /project/artifacts
          cd /project
          git init merlin
          cd merlin
          git remote add origin https://github.com/RMerl/asuswrt-merlin.ng.git
          git fetch --depth 1 origin "$MERLIN_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$MERLIN_COMMIT"

          grep -q '^SERIALNO=102.8$' release/src-rt/version.conf
          grep -q '^EXTENDNO=4$' release/src-rt/version.conf
          grep -q '^RCNO=0$' release/src-rt/version.conf
          grep -q '^GT-BE19000AI_CHIP_PROFILE=6813$' release/src-rt-5.04behnd.4916/chip_profile.mak
          test -s release/src-rt-5.04behnd.4916/targets/96813GW/96813GW.GT-BE19000AI

          printf '%s\n' "$MERLIN_COMMIT" > /project/artifacts/MERLIN_COMMIT.txt
          printf '%s\n' "$EXPECTED_VERSION" > /project/artifacts/MERLIN_VERSION.txt

      - name: Verify effective source-built wlshared path
        shell: bash
        run: |
          set -euo pipefail
          cd /project/merlin
          WLSHARED_MAKE=release/src-rt-5.04behnd.4916/bcmdrivers/broadcom/net/wl/shared/impl1/Makefile
          DHD_MAKE=release/src-rt-5.04behnd.4916/router-sysdep.gt-be19000ai/hnd_dhd/Makefile
          DHD_PREBUILT=release/src-rt-5.04behnd.4916/router-sysdep.gt-be19000ai/hnd_extra/prebuilt/dhd.o

          grep -q 'wlshared-objs := wlshared_linux.o' "$WLSHARED_MAKE"
          grep -q 'prebuilt := dhd.o' "$DHD_MAKE"
          test -s "$DHD_PREBUILT"
          sha256sum "$DHD_PREBUILT" > /project/artifacts/DHD_PREBUILT_SHA256.txt

          {
            echo 'wlshared=source-built'
            echo 'dhd=prebuilt-unmodified'
            echo "repair=$FCD_D3LUT_MARKER"
          } > /project/artifacts/PATCH_PATH.txt

      - name: Apply global D3LUT stale-entry repair
        shell: bash
        run: |
          set -euo pipefail
          SRC=/project/merlin/release/src-rt-5.04behnd.4916/bcmdrivers/broadcom/net/wl/shared/impl1/wlshared_linux.c

          python3 - "$SRC" "$FCD_D3LUT_MARKER" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          marker = sys.argv[2]
          text = path.read_text()

          old = '''\t/* function is for dhd device */
\t/* dhd or eth devices */
\tif (dhd_pktc_req_hook && (is_netdev_wlan_dhd(dev) || !is_netdev_wlan(dev)))
\t\tdhd_pktc_req_hook(PKTC_TBL_BRIDGE_EVENT, (unsigned long)(fdb_info->addr),
\t\t\t(unsigned long)dev, (unsigned long)event);'''

          new = '''\t/* function is for dhd device */
\t/* dhd or eth devices */
\tif (dhd_pktc_req_hook && (is_netdev_wlan_dhd(dev) || !is_netdev_wlan(dev))) {
\t\t/* FCD_DHD_D3LUT_REPAIR_V1: purge stale radio-pool ownership globally. */
\t\tif (is_netdev_wlan_dhd(dev) && dhd_pktc_del_hook &&
\t\t    ((event == SWITCHDEV_FDB_ADD_TO_DEVICE) ||
\t\t     (event == SWITCHDEV_FDB_DEL_TO_DEVICE))) {
\t\t\tdhd_pktc_del_hook((unsigned long)(fdb_info->addr), NULL);
\t\t\treturn 0;
\t\t}

\t\tdhd_pktc_req_hook(PKTC_TBL_BRIDGE_EVENT, (unsigned long)(fdb_info->addr),
\t\t\t(unsigned long)dev, (unsigned long)event);
\t}'''

          if text.count(old) != 1:
              raise SystemExit(f"expected one stock DHD switchdev block, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old_load = 'printk("Loading wlshared Module...\\n");'
          new_load = f'printk("Loading wlshared Module ({marker})...\\n");'
          if text.count(old_load) != 1:
              raise SystemExit(f"expected one wlshared load printk, found {text.count(old_load)}")
          text = text.replace(old_load, new_load, 1)
          path.write_text(text)
          PY

          cd /project/merlin
          git diff --check
          git diff -- release/src-rt-5.04behnd.4916/bcmdrivers/broadcom/net/wl/shared/impl1/wlshared_linux.c > /project/artifacts/APPLIED_SOURCE_DIFF.patch
          test -s /project/artifacts/APPLIED_SOURCE_DIFF.patch
          grep -q "$FCD_D3LUT_MARKER" "$SRC"
          grep -q 'dhd_pktc_del_hook((unsigned long)(fdb_info->addr), NULL)' "$SRC"
          grep -q 'SWITCHDEV_FDB_ADD_TO_DEVICE' "$SRC"
          grep -q 'SWITCHDEV_FDB_DEL_TO_DEVICE' "$SRC"

      - name: Build patched GT-BE19000AI firmware
        shell: bash
        run: |
          set -euo pipefail
          ln -sfn /home/docker/am-toolchains/brcm-arm-hnd /opt/toolchains
          chown -R docker:docker /project/merlin /project/artifacts /home/docker

          cat > /project/build-gt-be19000ai.sh <<'BUILD'
          #!/usr/bin/env bash
          set -uo pipefail
          test "$(id -u)" -ne 0
          test "$(whoami)" = docker
          export LD_LIBRARY="${LD_LIBRARY:-}"
          source /home/docker/envs/bcm-hnd-ax-4.19be.sh
          cd /project/merlin/release/src-rt-5.04behnd.4916
          make gt-be19000ai 2>&1 | tee /project/artifacts/BUILD.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > /project/artifacts/MAKE_EXIT_CODE.txt
          exit "$rc"
          BUILD

          chown docker:docker /project/build-gt-be19000ai.sh
          chmod 0755 /project/build-gt-be19000ai.sh
          sudo -u docker -H /project/build-gt-be19000ai.sh

      - name: Verify patched module and firmware artifact
        shell: bash
        run: |
          set -euo pipefail
          cd /project/artifacts
          test "$(cat MAKE_EXIT_CODE.txt)" = 0

          : > WLSHARED_BUILD_OBJECTS.txt
          : > WLSHARED_MARKER_HITS.txt
          find /project/merlin/release/src-rt-5.04behnd.4916 -type f \
            \( -name 'wlshared.o' -o -name 'wlshared.ko' \) -print \
            > WLSHARED_BUILD_OBJECTS.txt

          while IFS= read -r obj; do
            [ -s "$obj" ] || continue
            if grep -aFq "$FCD_D3LUT_MARKER" "$obj"; then
              printf '%s\n' "$obj" >> WLSHARED_MARKER_HITS.txt
            fi
          done < WLSHARED_BUILD_OBJECTS.txt

          test -s WLSHARED_BUILD_OBJECTS.txt
          test -s WLSHARED_MARKER_HITS.txt

          FIRMWARE="$EXPECTED_TARGET_DIR/$EXPECTED_FIRMWARE"
          test -s "$FIRMWARE"
          cp -f "$FIRMWARE" .
          sha256sum "$EXPECTED_FIRMWARE" > FIRMWARE_SHA256.txt
          sha256sum -c FIRMWARE_SHA256.txt
          printf '%s\n' "$EXPECTED_FIRMWARE" > FLASH_THIS_FILE.txt

          {
            echo 'VERIFIED_FOR_FLASH=YES'
            echo 'MODEL=GT-BE19000AI'
            echo "VERSION=$EXPECTED_VERSION"
            echo "UPSTREAM_COMMIT=$MERLIN_COMMIT"
            echo "FIX=$FCD_D3LUT_MARKER"
            echo 'PATCH_PATH=source-built-wlshared'
            echo 'DHD_PATH=prebuilt-unmodified'
            echo "FLASH_FILE=$EXPECTED_FIRMWARE"
            echo "FLASH_SHA256=$(cut -d' ' -f1 FIRMWARE_SHA256.txt)"
          } > FLASH_MANIFEST.txt

      - name: Upload verified patched firmware
        uses: actions/upload-artifact@v4
        with:
          name: GT-BE19000AI-3006.102.8_4-D3LUT-Runner-repair-v2-${{ github.run_number }}
          path: /project/artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics if build fails
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: GT-BE19000AI-D3LUT-v2-failure-${{ github.run_number }}
          path: /project/artifacts
          if-no-files-found: warn
          retention-days: 7
