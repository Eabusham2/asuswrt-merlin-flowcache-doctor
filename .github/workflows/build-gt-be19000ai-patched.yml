name: Build patched GT-BE19000AI firmware

on:
  workflow_dispatch:
    inputs:
      merlin_ref:
        description: Merlin branch/tag/ref to build
        required: true
        default: 3006.102.8_4
        type: string

permissions:
  contents: read

jobs:
  build:
    name: GT-BE19000AI patched firmware
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: gnuton/asuswrt-merlin-toolchains-docker:latest
      options: --user root
      volumes:
        - /mnt:/project

    steps:
      - name: Prepare large build volume
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /project/artifacts
          echo "Disk before build:"
          df -h / /mnt /project
          id

      - name: Fetch Merlin source
        shell: bash
        env:
          MERLIN_REF: ${{ inputs.merlin_ref }}
        run: |
          set -euo pipefail
          cd /project
          rm -rf merlin
          git clone --depth 1 --branch "$MERLIN_REF" \
            https://github.com/RMerl/asuswrt-merlin.ng.git merlin
          cd merlin
          git rev-parse HEAD | tee /project/artifacts/MERLIN_COMMIT.txt
          git status --short

      - name: Patch and verify PKTFWD source
        shell: bash
        run: |
          set -euo pipefail
          SRC=/project/merlin/release/src-rt-5.04behnd.4916/bcmdrivers/broadcom/net/wl/shared/impl1/dhd_pktfwd.c
          printf '%s\n' "${{ github.sha }}" > /project/artifacts/PATCH_REPO_COMMIT.txt

          python3 - "$SRC" <<'PY'
          import re
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          text = p.read_text()
          pattern = re.compile(r'(?m)^(\s*)if \(param2 == WLC_E_ASSOC\) \{$')
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one WLC_E_ASSOC cleanup gate, found {len(matches)}")

          indent = matches[0].group(1)
          replacement = (
              f"{indent}if ((param2 == WLC_E_ASSOC) ||\n"
              f"{indent}    (param2 == WLC_E_ASSOC_IND) ||\n"
              f"{indent}    (param2 == WLC_E_REASSOC) ||\n"
              f"{indent}    (param2 == WLC_E_REASSOC_IND)) {{"
          )
          text = pattern.sub(replacement, text, count=1)
          p.write_text(text)
          PY

          cd /project/merlin
          git diff --check
          git diff -- "$SRC" | tee /project/artifacts/APPLIED_SOURCE_DIFF.patch
          sha256sum /project/artifacts/APPLIED_SOURCE_DIFF.patch | tee /project/artifacts/PATCH_SHA256.txt

          grep -A14 -B3 'case dhd_pktfwd_req_assoc_sta_e' "$SRC" \
            | tee /project/artifacts/PATCHED_SOURCE_SNIPPET.txt
          grep -q 'param2 == WLC_E_ASSOC_IND' "$SRC"
          grep -q 'param2 == WLC_E_REASSOC' "$SRC"
          grep -q 'param2 == WLC_E_REASSOC_IND' "$SRC"

      - name: Build GT-BE19000AI
        shell: bash
        run: |
          set -euo pipefail
          source /home/docker/envs/bcm-hnd-ax-4.19be.sh
          cd /project/merlin/release/src-rt-5.04behnd.4916
          echo "Toolchain:"
          command -v aarch64-buildroot-linux-gnu-gcc || true
          echo "Disk at build start:"
          df -h /project
          make gt-be19000ai 2>&1 | tee /project/artifacts/BUILD.log

      - name: Package firmware
        shell: bash
        run: |
          set -euo pipefail
          IMGDIR=/project/merlin/release/src-rt-5.04behnd.4916/image
          mapfile -t images < <(find "$IMGDIR" -maxdepth 1 -type f -name '*_emmc_squashfs.pkgtb' -print)
          if [ "${#images[@]}" -lt 1 ]; then
            echo "No GT-BE19000AI emmc firmware image was produced." >&2
            find "$IMGDIR" -maxdepth 1 -type f -printf '%f\n' 2>/dev/null || true
            exit 1
          fi

          for image in "${images[@]}"; do
            cp -v "$image" /project/artifacts/
          done
          cd /project/artifacts
          sha256sum ./*_emmc_squashfs.pkgtb | tee FIRMWARE_SHA256.txt
          ls -lh ./*_emmc_squashfs.pkgtb

      - name: Upload patched firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GT-BE19000AI-pktfwd-patched-${{ github.run_number }}
          path: /project/artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GT-BE19000AI-build-failure-${{ github.run_number }}
          path: /project/artifacts
          if-no-files-found: warn
          retention-days: 7
