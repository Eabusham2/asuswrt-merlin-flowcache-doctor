name: Build patched GT-BE19000AI firmware

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MERLIN_BRANCH: asuswrt6
  MERLIN_COMMIT: e6ec7e95706d321c50d1b4b2f912b26323f6163e
  EXPECTED_SERIALNO: "102.8"
  EXPECTED_EXTENDNO: "4"
  EXPECTED_TARGET_DIR: /project/merlin/release/src-rt-5.04behnd.4916/targets/96813GW
  EXPECTED_FIRMWARE: GT-BE19000AI_3006_102.8_4_emmc_squashfs.pkgtb

jobs:
  build:
    name: GT-BE19000AI patched firmware
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: gnuton/asuswrt-merlin-toolchains-docker:latest
      # Keep Actions plumbing root. Broadcom/Merlin make itself runs as docker.
      options: --user root
      volumes:
        - /mnt:/project

    steps:
      - name: Prepare clean build volume
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /project/merlin /project/artifacts /project/build-gt-be19000ai.sh
          mkdir -p /project/artifacts
          chown -R docker:docker /home/docker /project
          df -h / /mnt /project

      - name: Fetch exact GT-BE19000AI Merlin source
        shell: bash
        run: |
          set -euo pipefail
          cd /project
          git init merlin
          cd merlin
          git remote add origin https://github.com/RMerl/asuswrt-merlin.ng.git
          git fetch --depth 1 origin "$MERLIN_COMMIT"
          git checkout --detach FETCH_HEAD
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$MERLIN_COMMIT"
          printf '%s\n' "$ACTUAL" > /project/artifacts/MERLIN_COMMIT.txt
          printf '%s\n' "$MERLIN_BRANCH" > /project/artifacts/MERLIN_LINEAGE.txt

      - name: Verify GT-BE19000AI baseline
        shell: bash
        run: |
          set -euo pipefail
          cd /project/merlin
          TARGET=release/src-rt-5.04behnd.4916/target.mak
          CHIP=release/src-rt-5.04behnd.4916/chip_profile.mak
          MODEL_CFG=release/src-rt-5.04behnd.4916/targets/96813GW/96813GW.GT-BE19000AI
          VERSION=release/src-rt/version.conf

          grep -q '^export GT-BE19000AI[[:space:]]*:=' "$TARGET"
          grep -q '^GT-BE19000AI_CHIP_PROFILE=6813$' "$CHIP"
          test -s "$MODEL_CFG"
          grep -q "^SERIALNO=${EXPECTED_SERIALNO}$" "$VERSION"
          grep -q "^EXTENDNO=${EXPECTED_EXTENDNO}$" "$VERSION"
          test -s release/src-rt-5.04behnd.4916/bcmdrivers/broadcom/net/wl/impl103/main/components/apps/afcd/prebuilt/GT-BE19000AI/afcd
          test -s release/src-rt-5.04behnd.4916/bcmdrivers/broadcom/net/wl/impl103/main/components/apps/locpold/prebuilt/GT-BE19000AI/bin/locpold

          {
            echo "lineage=$MERLIN_BRANCH"
            echo "commit=$MERLIN_COMMIT"
            grep -E '^(SERIALNO|EXTENDNO)=' "$VERSION"
            grep '^GT-BE19000AI_CHIP_PROFILE=' "$CHIP"
            grep '^export GT-BE19000AI[[:space:]]*:=' "$TARGET"
          } > /project/artifacts/BASELINE_VERIFICATION.txt

      - name: Apply and verify PKTFWD fix
        shell: bash
        run: |
          set -euo pipefail
          REL=release/src-rt-5.04behnd.4916/bcmdrivers/broadcom/net/wl/shared/impl1/dhd_pktfwd.c
          SRC=/project/merlin/$REL
          printf '%s\n' "${{ github.sha }}" > /project/artifacts/PATCH_REPO_COMMIT.txt

          python3 - "$SRC" <<'PY'
          import re
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          text = p.read_text()
          pattern = re.compile(r'(?m)^(\s*)if \(param2 == WLC_E_ASSOC\) \{$')
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one WLC_E_ASSOC cleanup gate, found {len(matches)}")

          indent = matches[0].group(1)
          replacement = (
              f"{indent}if ((param2 == WLC_E_ASSOC) ||\n"
              f"{indent}    (param2 == WLC_E_ASSOC_IND) ||\n"
              f"{indent}    (param2 == WLC_E_REASSOC) ||\n"
              f"{indent}    (param2 == WLC_E_REASSOC_IND)) {{"
          )
          p.write_text(pattern.sub(replacement, text, count=1))
          PY

          cd /project/merlin
          git diff --check
          git diff -- "$REL" > /project/artifacts/APPLIED_SOURCE_DIFF.patch
          test -s /project/artifacts/APPLIED_SOURCE_DIFF.patch
          grep -A14 -B3 'case dhd_pktfwd_req_assoc_sta_e' "$SRC" > /project/artifacts/PATCHED_SOURCE_SNIPPET.txt
          grep -q 'param2 == WLC_E_ASSOC_IND' "$SRC"
          grep -q 'param2 == WLC_E_REASSOC' "$SRC"
          grep -q 'param2 == WLC_E_REASSOC_IND' "$SRC"

      - name: Build GT-BE19000AI and preserve exit code
        shell: bash
        run: |
          set -euo pipefail

          # This exact non-destructive toolchain mapping was used by the successful build path.
          ln -sfn /home/docker/am-toolchains/brcm-arm-hnd /opt/toolchains
          chown -R docker:docker /project/merlin /project/artifacts /home/docker

          cat > /project/build-gt-be19000ai.sh <<'BUILD'
          #!/usr/bin/env bash
          set -uo pipefail
          test "$(id -u)" -ne 0
          test "$(whoami)" = docker
          export LD_LIBRARY="${LD_LIBRARY:-}"
          source /home/docker/envs/bcm-hnd-ax-4.19be.sh
          cd /project/merlin/release/src-rt-5.04behnd.4916
          make gt-be19000ai 2>&1 | tee /project/artifacts/BUILD.log
          rc=${PIPESTATUS[0]}
          exit "$rc"
          BUILD

          chown docker:docker /project/build-gt-be19000ai.sh
          chmod 0755 /project/build-gt-be19000ai.sh

          set +e
          sudo -u docker -H /project/build-gt-be19000ai.sh
          rc=$?
          set -e
          printf '%s\n' "$rc" > /project/artifacts/MAKE_EXIT_CODE.txt
          echo "Merlin make exit code: $rc"

          # Do not fail here. The next steps always salvage evidence first.
          exit 0

      - name: Salvage build outputs and diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p /project/artifacts

          if [ -d "$EXPECTED_TARGET_DIR" ]; then
            ls -lah "$EXPECTED_TARGET_DIR" > /project/artifacts/TARGET_DIR_LISTING.txt 2>&1
            find "$EXPECTED_TARGET_DIR" -maxdepth 1 -type f -name '*.pkgtb' -printf '%f %s bytes\n' \
              | sort > /project/artifacts/PKGTB_OUTPUTS.txt 2>&1
          else
            echo "missing: $EXPECTED_TARGET_DIR" > /project/artifacts/TARGET_DIR_LISTING.txt
            : > /project/artifacts/PKGTB_OUTPUTS.txt
          fi

          FIRMWARE="$EXPECTED_TARGET_DIR/$EXPECTED_FIRMWARE"
          if [ -s "$FIRMWARE" ]; then
            cp -f "$FIRMWARE" /project/artifacts/
            cd /project/artifacts
            sha256sum "$EXPECTED_FIRMWARE" > FIRMWARE_SHA256.txt
            sha256sum -c FIRMWARE_SHA256.txt > FIRMWARE_SHA256_CHECK.txt 2>&1
            echo "FOUND $FIRMWARE" > FIRMWARE_STATUS.txt
          else
            echo "MISSING $FIRMWARE" > /project/artifacts/FIRMWARE_STATUS.txt
          fi

          if [ -s /project/artifacts/BUILD.log ]; then
            tail -n 1000 /project/artifacts/BUILD.log > /project/artifacts/BUILD_TAIL.log
          else
            echo "BUILD.log not created" > /project/artifacts/BUILD_TAIL.log
          fi

          # Diagnostic only: record any DHD/PKTFWD build outputs we can find.
          if [ -d /project/merlin/release/src-rt-5.04behnd.4916/bcmdrivers/broadcom/net/wl ]; then
            find /project/merlin/release/src-rt-5.04behnd.4916/bcmdrivers/broadcom/net/wl \
              -type f \( -name 'dhd_pktfwd.o' -o -name 'dhd*.ko' -o -name '*pktfwd*.o' \) -print \
              > /project/artifacts/DHD_BUILD_OBJECTS.txt 2>/dev/null
          else
            echo "wl build tree unavailable" > /project/artifacts/DHD_BUILD_OBJECTS.txt
          fi

          chmod -R a+rX /project/artifacts 2>/dev/null || true
          exit 0

      - name: Verify successful flash build
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd /project/artifacts

          test -s MAKE_EXIT_CODE.txt
          test "$(cat MAKE_EXIT_CODE.txt)" = "0"
          test -s "$EXPECTED_FIRMWARE"
          test -s FIRMWARE_SHA256.txt
          sha256sum -c FIRMWARE_SHA256.txt
          test "$(cat MERLIN_COMMIT.txt)" = "$MERLIN_COMMIT"
          grep -q '^SERIALNO=102.8$' BASELINE_VERIFICATION.txt
          grep -q '^EXTENDNO=4$' BASELINE_VERIFICATION.txt
          grep -q 'WLC_E_ASSOC_IND' APPLIED_SOURCE_DIFF.patch
          grep -q 'WLC_E_REASSOC' APPLIED_SOURCE_DIFF.patch
          grep -q 'WLC_E_REASSOC_IND' APPLIED_SOURCE_DIFF.patch

          printf '%s\n' "$EXPECTED_FIRMWARE" > FLASH_THIS_FILE.txt
          {
            echo "VERIFIED_FOR_FLASH=YES"
            echo "MODEL=GT-BE19000AI"
            echo "VERSION=3006.102.8_4"
            echo "UPSTREAM_COMMIT=$MERLIN_COMMIT"
            echo "FLASH_FILE=$EXPECTED_FIRMWARE"
            echo "FLASH_SHA256=$(cut -d' ' -f1 FIRMWARE_SHA256.txt)"
          } > FLASH_MANIFEST.txt

      - name: Upload patched firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GT-BE19000AI-3006.102.8_4-pktfwd-patched-${{ github.run_number }}
          path: /project/artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: GT-BE19000AI-build-failure-${{ github.run_number }}
          path: /project/artifacts
          if-no-files-found: warn
          retention-days: 7
