name: Build patched GT-BE19000AI firmware

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MERLIN_BRANCH: asuswrt6
  EXPECTED_TARGET_DIR: /project/merlin/release/src-rt-5.04behnd.4916/targets/96813GW
  FCD_D3LUT_MARKER: FCD_DHD_D3LUT_REPAIR_V1

jobs:
  build:
    name: GT-BE19000AI D3LUT repair firmware
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: gnuton/asuswrt-merlin-toolchains-docker:latest
      options: --user root
      volumes:
        - /mnt:/project

    steps:
      - name: Prepare clean build volume
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /project/merlin /project/artifacts /project/build-gt-be19000ai.sh
          mkdir -p /project/artifacts
          chown -R docker:docker /home/docker /project
          df -h / /mnt /project

      - name: Resolve latest stable GT-BE19000AI Merlin release
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          cd /project
          git init merlin
          cd merlin
          git remote add origin https://github.com/RMerl/asuswrt-merlin.ng.git

          git fetch --depth 1000 origin \
            "+refs/heads/${MERLIN_BRANCH}:refs/remotes/origin/${MERLIN_BRANCH}"

          VERSION_PATH=release/src-rt/version.conf
          BUILD_ALL=tools/build-all
          CHIP=release/src-rt-5.04behnd.4916/chip_profile.mak
          MODEL_CFG=release/src-rt-5.04behnd.4916/targets/96813GW/96813GW.GT-BE19000AI
          WLSHARED=release/src-rt-5.04behnd.4916/bcmdrivers/broadcom/net/wl/shared/impl1/wlshared_linux.c
          WLSHARED_MAKE=release/src-rt-5.04behnd.4916/bcmdrivers/broadcom/net/wl/shared/impl1/Makefile
          DHD_MAKE=release/src-rt-5.04behnd.4916/router-sysdep.gt-be19000ai/hnd_dhd/Makefile
          DHD_PREBUILT=release/src-rt-5.04behnd.4916/router-sysdep.gt-be19000ai/hnd_extra/prebuilt/dhd.o
          AFCD=release/src-rt-5.04behnd.4916/bcmdrivers/broadcom/net/wl/impl103/main/components/apps/afcd/prebuilt/GT-BE19000AI/afcd
          LOCPO=release/src-rt-5.04behnd.4916/bcmdrivers/broadcom/net/wl/impl103/main/components/apps/locpold/prebuilt/GT-BE19000AI/bin/locpold

          SELECTED=""
          SERIAL=""
          EXTEND=""

          while read -r sha; do
            conf="$(git show "${sha}:${VERSION_PATH}" 2>/dev/null)" || continue
            serial="$(printf '%s\n' "$conf" | sed -n 's/^SERIALNO=//p' | head -n1)"
            extend="$(printf '%s\n' "$conf" | sed -n 's/^EXTENDNO=//p' | head -n1)"
            rcno="$(printf '%s\n' "$conf" | sed -n 's/^RCNO=//p' | head -n1)"

            [[ "$serial" =~ ^[0-9]+\.[0-9]+$ ]] || continue
            [[ "$extend" =~ ^[0-9]+$ ]] || continue
            [[ "${rcno:-0}" == "0" ]] || continue

            for required in "$MODEL_CFG" "$WLSHARED" "$WLSHARED_MAKE" "$DHD_MAKE" "$DHD_PREBUILT" "$AFCD" "$LOCPO" "$BUILD_ALL"; do
              git cat-file -e "${sha}:${required}" 2>/dev/null || { required_missing=1; break; }
              required_missing=0
            done
            [ "${required_missing:-0}" = 0 ] || continue

            build_all_text="$(git show "${sha}:${BUILD_ALL}" 2>/dev/null)" || continue
            chip_text="$(git show "${sha}:${CHIP}" 2>/dev/null)" || continue
            wlshared_make_text="$(git show "${sha}:${WLSHARED_MAKE}" 2>/dev/null)" || continue
            dhd_make_text="$(git show "${sha}:${DHD_MAKE}" 2>/dev/null)" || continue
            grep -q '^BRANCH_GTBE19000AI=asuswrt6$' <<<"$build_all_text" || continue
            grep -Fq 'elif [ "$FWMODEL" = "gt-be19000ai" ] ; then' <<<"$build_all_text" || continue
            grep -q '^GT-BE19000AI_CHIP_PROFILE=6813$' <<<"$chip_text" || continue
            grep -q 'wlshared-objs := wlshared_linux.o' <<<"$wlshared_make_text" || continue
            grep -q 'prebuilt := dhd.o' <<<"$dhd_make_text" || continue

            SELECTED="$sha"
            SERIAL="$serial"
            EXTEND="$extend"
            break
          done < <(git log --format=%H "refs/remotes/origin/${MERLIN_BRANCH}" -- "$VERSION_PATH")

          if [ -z "$SELECTED" ]; then
            echo "No stable GT-BE19000AI-compatible release with the source-built wlshared repair point was found." >&2
            exit 1
          fi

          VERSION="3006.${SERIAL}_${EXTEND}"
          FIRMWARE="GT-BE19000AI_3006_${SERIAL}_${EXTEND}_emmc_squashfs.pkgtb"

          git checkout --detach "$SELECTED"
          test "$(git rev-parse HEAD)" = "$SELECTED"

          {
            echo "MERLIN_COMMIT=$SELECTED"
            echo "EXPECTED_SERIALNO=$SERIAL"
            echo "EXPECTED_EXTENDNO=$EXTEND"
            echo "EXPECTED_VERSION=$VERSION"
            echo "EXPECTED_FIRMWARE=$FIRMWARE"
          } >> "$GITHUB_ENV"

          {
            echo "commit=$SELECTED"
            echo "serial=$SERIAL"
            echo "extend=$EXTEND"
            echo "version=$VERSION"
            echo "firmware=$FIRMWARE"
          } >> "$GITHUB_OUTPUT"

          printf '%s\n' "$SELECTED" > /project/artifacts/MERLIN_COMMIT.txt
          printf '%s\n' "$MERLIN_BRANCH" > /project/artifacts/MERLIN_LINEAGE.txt
          {
            echo "AUTO_RELEASE_SELECTION=YES"
            echo "POLICY=latest-stable-compatible-wlshared"
            echo "LINEAGE=$MERLIN_BRANCH"
            echo "COMMIT=$SELECTED"
            echo "VERSION=$VERSION"
            echo "FIRMWARE=$FIRMWARE"
          } > /project/artifacts/RELEASE_RESOLUTION.txt

          echo "Selected latest stable compatible release: $VERSION"
          echo "Selected upstream commit: $SELECTED"

      - name: Verify GT-BE19000AI build path
        shell: bash
        run: |
          set -euo pipefail
          cd /project/merlin
          BUILD_ALL=tools/build-all
          CHIP=release/src-rt-5.04behnd.4916/chip_profile.mak
          MODEL_CFG=release/src-rt-5.04behnd.4916/targets/96813GW/96813GW.GT-BE19000AI
          VERSION=release/src-rt/version.conf
          WLSHARED_MAKE=release/src-rt-5.04behnd.4916/bcmdrivers/broadcom/net/wl/shared/impl1/Makefile
          DHD_MAKE=release/src-rt-5.04behnd.4916/router-sysdep.gt-be19000ai/hnd_dhd/Makefile
          DHD_PREBUILT=release/src-rt-5.04behnd.4916/router-sysdep.gt-be19000ai/hnd_extra/prebuilt/dhd.o

          test "$(git rev-parse HEAD)" = "$MERLIN_COMMIT"
          grep -q '^BRANCH_GTBE19000AI=asuswrt6$' "$BUILD_ALL"
          grep -Fq 'elif [ "$FWMODEL" = "gt-be19000ai" ] ; then' "$BUILD_ALL"
          grep -q '^GT-BE19000AI_CHIP_PROFILE=6813$' "$CHIP"
          test -s "$MODEL_CFG"
          grep -q "^SERIALNO=${EXPECTED_SERIALNO}$" "$VERSION"
          grep -q "^EXTENDNO=${EXPECTED_EXTENDNO}$" "$VERSION"
          grep -q '^RCNO=0$' "$VERSION"
          grep -q 'wlshared-objs := wlshared_linux.o' "$WLSHARED_MAKE"
          grep -q 'prebuilt := dhd.o' "$DHD_MAKE"
          test -s "$DHD_PREBUILT"
          test -s release/src-rt-5.04behnd.4916/bcmdrivers/broadcom/net/wl/impl103/main/components/apps/afcd/prebuilt/GT-BE19000AI/afcd
          test -s release/src-rt-5.04behnd.4916/bcmdrivers/broadcom/net/wl/impl103/main/components/apps/locpold/prebuilt/GT-BE19000AI/bin/locpold

          sha256sum "$DHD_PREBUILT" > /project/artifacts/DHD_PREBUILT_SHA256.txt
          {
            echo "lineage=$MERLIN_BRANCH"
            echo "commit=$MERLIN_COMMIT"
            echo "version=$EXPECTED_VERSION"
            grep -E '^(SERIALNO|EXTENDNO|RCNO)=' "$VERSION"
            grep '^GT-BE19000AI_CHIP_PROFILE=' "$CHIP"
            grep '^BRANCH_GTBE19000AI=' "$BUILD_ALL"
            grep -F 'elif [ "$FWMODEL" = "gt-be19000ai" ] ; then' "$BUILD_ALL"
            echo "wlshared=source-built"
            echo "dhd=prebuilt"
          } > /project/artifacts/BASELINE_VERIFICATION.txt

      - name: Apply source-built wlshared D3LUT repair
        shell: bash
        run: |
          set -euo pipefail
          REL=release/src-rt-5.04behnd.4916/bcmdrivers/broadcom/net/wl/shared/impl1/wlshared_linux.c
          SRC=/project/merlin/$REL
          printf '%s\n' "${{ github.sha }}" > /project/artifacts/PATCH_REPO_COMMIT.txt

          python3 - "$SRC" "$FCD_D3LUT_MARKER" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          marker = sys.argv[2]
          text = p.read_text()
          if marker in text:
              raise SystemExit("repair marker unexpectedly already present upstream")

          old = '''\t/* function is for dhd device */
\t/* dhd or eth devices */
\tif (dhd_pktc_req_hook && (is_netdev_wlan_dhd(dev) || !is_netdev_wlan(dev)))
\t\tdhd_pktc_req_hook(PKTC_TBL_BRIDGE_EVENT, (unsigned long)(fdb_info->addr),
\t\t\t(unsigned long)dev, (unsigned long)event);'''
          new = '''\t/* function is for dhd device */
\t/* dhd or eth devices */
\tif (dhd_pktc_req_hook && (is_netdev_wlan_dhd(dev) || !is_netdev_wlan(dev))) {
\t\t/*
\t\t * FCD_DHD_D3LUT_REPAIR_V1
\t\t *
\t\t * GT-BE19000AI uses a prebuilt DHD object.  Its PKTFWD association
\t\t * request globally deletes D3LUT state for WLC_E_ASSOC only, so MLO
\t\t * reassociation/source-move sequences can retain a MAC in an old
\t\t * radio pool.  Bridge FDB lifecycle notifications are visible here
\t\t * in source-built wlshared.  For DHD FDB add/delete, use the exported
\t\t * delete hook with net_device == NULL so PKTFWD searches the global
\t\t * pool instead of trusting a possibly stale radio/device mapping.
\t\t */
\t\tif (is_netdev_wlan_dhd(dev) && dhd_pktc_del_hook &&
\t\t    ((event == SWITCHDEV_FDB_ADD_TO_DEVICE) ||
\t\t     (event == SWITCHDEV_FDB_DEL_TO_DEVICE))) {
\t\t\tdhd_pktc_del_hook((unsigned long)(fdb_info->addr), NULL);
\t\t\treturn 0;
\t\t}

\t\tdhd_pktc_req_hook(PKTC_TBL_BRIDGE_EVENT, (unsigned long)(fdb_info->addr),
\t\t\t(unsigned long)dev, (unsigned long)event);
\t}'''

          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one dhd switchdev bridge block, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old_init = 'printk("Loading wlshared Module...\\n");'
          new_init = f'printk("Loading wlshared Module ({marker})...\\n");'
          if text.count(old_init) != 1:
              raise SystemExit(f"expected exactly one wlshared load marker, found {text.count(old_init)}")
          text = text.replace(old_init, new_init, 1)
          p.write_text(text)
          PY

          cd /project/merlin
          git diff --check
          git diff -- "$REL" > /project/artifacts/APPLIED_SOURCE_DIFF.patch
          test -s /project/artifacts/APPLIED_SOURCE_DIFF.patch
          grep -A34 -B4 'FCD_DHD_D3LUT_REPAIR_V1' "$SRC" > /project/artifacts/PATCHED_SOURCE_SNIPPET.txt
          grep -q 'dhd_pktc_del_hook((unsigned long)(fdb_info->addr), NULL)' "$SRC"
          grep -q 'SWITCHDEV_FDB_ADD_TO_DEVICE' "$SRC"
          grep -q 'SWITCHDEV_FDB_DEL_TO_DEVICE' "$SRC"
          grep -q "$FCD_D3LUT_MARKER" "$SRC"

      - name: Build GT-BE19000AI and preserve exit code
        shell: bash
        run: |
          set -euo pipefail

          ln -sfn /home/docker/am-toolchains/brcm-arm-hnd /opt/toolchains
          chown -R docker:docker /project/merlin /project/artifacts /home/docker

          cat > /project/build-gt-be19000ai.sh <<'BUILD'
          #!/usr/bin/env bash
          set -uo pipefail
          test "$(id -u)" -ne 0
          test "$(whoami)" = docker
          export LD_LIBRARY="${LD_LIBRARY:-}"
          source /home/docker/envs/bcm-hnd-ax-4.19be.sh
          cd /project/merlin/release/src-rt-5.04behnd.4916
          make gt-be19000ai 2>&1 | tee /project/artifacts/BUILD.log
          rc=${PIPESTATUS[0]}
          exit "$rc"
          BUILD

          chown docker:docker /project/build-gt-be19000ai.sh
          chmod 0755 /project/build-gt-be19000ai.sh

          set +e
          sudo -u docker -H /project/build-gt-be19000ai.sh
          rc=$?
          set -e
          printf '%s\n' "$rc" > /project/artifacts/MAKE_EXIT_CODE.txt
          echo "Merlin make exit code: $rc"

          exit 0

      - name: Salvage build outputs and diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p /project/artifacts

          if [ -d "$EXPECTED_TARGET_DIR" ]; then
            ls -lah "$EXPECTED_TARGET_DIR" > /project/artifacts/TARGET_DIR_LISTING.txt 2>&1
            find "$EXPECTED_TARGET_DIR" -maxdepth 1 -type f -name '*.pkgtb' -printf '%f %s bytes\n' \
              | sort > /project/artifacts/PKGTB_OUTPUTS.txt 2>&1
          else
            echo "missing: $EXPECTED_TARGET_DIR" > /project/artifacts/TARGET_DIR_LISTING.txt
            : > /project/artifacts/PKGTB_OUTPUTS.txt
          fi

          FIRMWARE="$EXPECTED_TARGET_DIR/$EXPECTED_FIRMWARE"
          if [ -s "$FIRMWARE" ]; then
            cp -f "$FIRMWARE" /project/artifacts/
            cd /project/artifacts
            sha256sum "$EXPECTED_FIRMWARE" > FIRMWARE_SHA256.txt
            sha256sum -c FIRMWARE_SHA256.txt > FIRMWARE_SHA256_CHECK.txt 2>&1
            echo "FOUND $FIRMWARE" > FIRMWARE_STATUS.txt
          else
            echo "MISSING $FIRMWARE" > /project/artifacts/FIRMWARE_STATUS.txt
          fi

          if [ -s /project/artifacts/BUILD.log ]; then
            tail -n 1200 /project/artifacts/BUILD.log > /project/artifacts/BUILD_TAIL.log
            grep -E 'wlshared_linux\.(c|o)|wlshared\.(o|ko)' /project/artifacts/BUILD.log \
              > /project/artifacts/WLSHARED_BUILD_LOG.txt 2>/dev/null || true
          else
            echo "BUILD.log not created" > /project/artifacts/BUILD_TAIL.log
            : > /project/artifacts/WLSHARED_BUILD_LOG.txt
          fi

          : > /project/artifacts/WLSHARED_BUILD_OBJECTS.txt
          : > /project/artifacts/WLSHARED_MARKER_HITS.txt
          if [ -d /project/merlin/release/src-rt-5.04behnd.4916 ]; then
            find /project/merlin/release/src-rt-5.04behnd.4916 -type f \
              \( -name 'wlshared.o' -o -name 'wlshared.ko' \) -print \
              > /project/artifacts/WLSHARED_BUILD_OBJECTS.txt 2>/dev/null
            while IFS= read -r f; do
              [ -f "$f" ] || continue
              if grep -aFq "$FCD_D3LUT_MARKER" "$f" 2>/dev/null; then
                printf '%s\n' "$f" >> /project/artifacts/WLSHARED_MARKER_HITS.txt
              fi
            done < /project/artifacts/WLSHARED_BUILD_OBJECTS.txt
          fi

          chmod -R a+rX /project/artifacts 2>/dev/null || true
          exit 0

      - name: Verify successful flash build
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd /project/artifacts

          test -s MAKE_EXIT_CODE.txt
          test "$(cat MAKE_EXIT_CODE.txt)" = "0"
          test -s "$EXPECTED_FIRMWARE"
          test -s FIRMWARE_SHA256.txt
          sha256sum -c FIRMWARE_SHA256.txt
          test "$(cat MERLIN_COMMIT.txt)" = "$MERLIN_COMMIT"
          grep -q "^SERIALNO=${EXPECTED_SERIALNO}$" BASELINE_VERIFICATION.txt
          grep -q "^EXTENDNO=${EXPECTED_EXTENDNO}$" BASELINE_VERIFICATION.txt
          grep -q '^RCNO=0$' BASELINE_VERIFICATION.txt
          grep -q "version=${EXPECTED_VERSION}" BASELINE_VERIFICATION.txt
          grep -q 'wlshared=source-built' BASELINE_VERIFICATION.txt
          grep -q 'dhd=prebuilt' BASELINE_VERIFICATION.txt
          grep -q 'FCD_DHD_D3LUT_REPAIR_V1' APPLIED_SOURCE_DIFF.patch
          grep -q 'dhd_pktc_del_hook((unsigned long)(fdb_info->addr), NULL)' APPLIED_SOURCE_DIFF.patch
          test -s WLSHARED_BUILD_OBJECTS.txt
          test -s WLSHARED_MARKER_HITS.txt

          printf '%s\n' "$EXPECTED_FIRMWARE" > FLASH_THIS_FILE.txt
          {
            echo "VERIFIED_FOR_FLASH=YES"
            echo "AUTO_RELEASE_SELECTION=YES"
            echo "RELEASE_POLICY=latest-stable-compatible-wlshared"
            echo "MODEL=GT-BE19000AI"
            echo "VERSION=$EXPECTED_VERSION"
            echo "UPSTREAM_LINEAGE=$MERLIN_BRANCH"
            echo "UPSTREAM_COMMIT=$MERLIN_COMMIT"
            echo "FIX=$FCD_D3LUT_MARKER"
            echo "PATCH_PATH=source-built-wlshared"
            echo "DHD_PATH=prebuilt-unmodified"
            echo "FLASH_FILE=$EXPECTED_FIRMWARE"
            echo "FLASH_SHA256=$(cut -d' ' -f1 FIRMWARE_SHA256.txt)"
          } > FLASH_MANIFEST.txt

      - name: Upload patched firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GT-BE19000AI-${{ steps.resolve.outputs.version }}-d3lut-repair-${{ github.run_number }}
          path: /project/artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: GT-BE19000AI-build-failure-${{ github.run_number }}
          path: /project/artifacts
          if-no-files-found: warn
          retention-days: 7
