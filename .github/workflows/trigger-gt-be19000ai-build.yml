name: Trigger GT-BE19000AI firmware build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trigger-gt-be19000ai-build.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch current patched firmware build
    runs-on: ubuntu-latest
    steps:
      - name: Start build from current main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/build-gt-be19000ai-patched.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Dispatched build-gt-be19000ai-patched.yml from current main."
