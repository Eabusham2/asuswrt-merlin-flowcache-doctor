name: Validate GT-BE19000AI flash artifact

on:
  workflow_run:
    workflows: ["Build patched GT-BE19000AI firmware"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  validate:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download firmware artifact from triggering run
        uses: actions/download-artifact@v4
        with:
          path: /tmp/firmware-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          merge-multiple: true

      - name: Install firmware inspection tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools binutils file

      - name: Verify packaged firmware end to end
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/verify_gt_be19000ai_artifact.sh
          tools/verify_gt_be19000ai_artifact.sh \
            /tmp/firmware-artifact \
            /tmp/postbuild-validation \
            "$GITHUB_WORKSPACE/tools/patch_dhd_pktfwd_prebuilt.py"

      - name: Upload post-build verification proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GT-BE19000AI-postbuild-validation-${{ github.event.workflow_run.run_number }}
          path: /tmp/postbuild-validation
          if-no-files-found: warn
          retention-days: 14
